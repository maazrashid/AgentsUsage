name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: AgentsUsage.exe
            archive: AgentsUsage-windows-amd64.zip
            ldflags: -s -w -H=windowsgui
          - goos: linux
            goarch: amd64
            binary: AgentsUsage
            archive: AgentsUsage-linux-amd64.tar.gz
            ldflags: -s -w
          - goos: darwin
            goarch: amd64
            binary: AgentsUsage
            archive: AgentsUsage-darwin-amd64.tar.gz
            ldflags: -s -w
          - goos: darwin
            goarch: arm64
            binary: AgentsUsage
            archive: AgentsUsage-darwin-arm64.tar.gz
            ldflags: -s -w
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        shell: bash
        run: |
          mkdir -p stage dist
          go build -trimpath -buildvcs=false -ldflags="${{ matrix.ldflags }}" -o "stage/${{ matrix.binary }}" ./cmd/agentsusage
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd stage && zip -9 "../dist/${{ matrix.archive }}" "${{ matrix.binary }}")
          else
            tar -C stage -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}"
          fi
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: AgentsUsage-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum AgentsUsage-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
